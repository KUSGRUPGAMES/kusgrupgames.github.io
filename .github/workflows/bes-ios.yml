name: BEŞ iOS derleme

# Her push'ta: kalite kapisi (Linux) + simulator icin IMZASIZ derleme (macOS).
# Tek isi "BES iOS'ta hala derleniyor mu" sorusunu kapatmak; Apple hesabi
# gerektirmez.
#
# GERCEK YAYIN BU DOSYADA DEGIL: imzalama, IPA ve TestFlight yuklemesi elle
# calistirilan bes-release-ios.yml icindedir. Ikisi bilerek ayri: her
# commit'te TestFlight'a build gondermek hem yavas olurdu hem de yayin
# kararini kazayla vermek demekti.
#
# Diger urunler Capacitor, BES Expo. Ayni matrise sokmak neredeyse her adima
# bir `if` eklemek demekti; bu yuzden BES'in kendi dosyasi var.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/bes-ios.yml'
      - 'bes/**'
  workflow_dispatch:

jobs:
  kapi:
    name: Kalite kapisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bes/package-lock.json

      - name: Bagimliliklar
        working-directory: bes
        run: npm ci --no-audit --no-fund

      # macOS dakikasi pahali; kirik kodu oraya hic gondermiyoruz.
      - name: tsc + eslint + test
        working-directory: bes
        run: npm run gate

      # Metro, tsc ve jest'in kabul ettigi bazi kaliplari reddeder (sablon
      # degiskenli `require` boyleydi). Paketlemeyi ayri bir kapi sayiyoruz.
      - name: Metro paketi
        working-directory: bes
        run: npm run bundle

  ios:
    name: iOS (imzasiz)
    needs: kapi
    runs-on: macos-latest
    env:
      APP_VARIANT: production
      BUILD_NUMBER: ${{ github.run_number }}
      # D32/D33: sunucu, abonelik ve reklam kimlikleri. Secret yoksa boş gelir;
      # uygulama topluluğu/Pro'yu kapalı, reklamı test biriminde tutar.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_BANNER_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_IOS }}
      EXPO_PUBLIC_ADMOB_BANNER_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ANDROID }}
      EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_IOS }}
      EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID }}
      EXPO_PUBLIC_ADMOB_APPOPEN_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_APPOPEN_IOS }}
      EXPO_PUBLIC_ADMOB_APPOPEN_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_APPOPEN_ANDROID }}
      EXPO_PUBLIC_ADMOB_REWARDED_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_IOS }}
      EXPO_PUBLIC_ADMOB_REWARDED_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_ANDROID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bes/package-lock.json

      - name: Bagimliliklar
        working-directory: bes
        run: npm ci --no-audit --no-fund

      - name: Native projeyi uret
        working-directory: bes
        run: npx expo prebuild --platform ios --clean

      # Ikon bir kez EKSIK gitti (Capacitor tarafinda) ve TestFlight'a bos yer
      # tutucu ikonuyla bir yapi cikti. Ikon magazada urunun yuzu.
      - name: Uretilen projeyi dogrula
        working-directory: bes
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          AD=$(basename "$WS" .xcworkspace)
          echo "SEMA=$AD" >> "$GITHUB_ENV"
          echo "WORKSPACE=$WS" >> "$GITHUB_ENV"
          echo "sema: $AD"

          PLIST="ios/$AD/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"

          IKON=$(ls ios/$AD/Images.xcassets/AppIcon.appiconset/*.png 2>/dev/null | head -1)
          test -n "$IKON" || { echo "::error::uygulama ikonu yerlestirilmemis"; exit 1; }
          echo "ikon yerinde: $IKON"

          # Kullanilmayan arka plan konum izni App Review'da sorulur ve
          # reddedilir. expo-location eklentisi bunu varsayilan olarak yaziyordu.
          for K in NSLocationAlwaysUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$K" "$PLIST" >/dev/null 2>&1; then
              echo "::error::kullanilmayan arka plan konum izni: $K"; exit 1
            fi
          done
          echo "arka plan konum izni yok (dogrulandi)"

          # Widget hic gorunmeme sikayeti bir kez yasandi; kok neden
          # bulunamadi ama olasi butun kirilma noktalari burada sinaniyor —
          # biri regrese olursa derleme kirmizi doner, sessizce kaybolmaz.
          WIDGET_PLIST="targets/widget/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_PLIST" \
            | grep -q "com.apple.widgetkit-extension" \
            || { echo "::error::widget NSExtensionPointIdentifier eksik/yanlis"; exit 1; }
          test -n "$(ls targets/widget/Assets.xcassets/AppIcon.appiconset/*.png 2>/dev/null | head -1)" \
            || { echo "::error::widget ikonu yerlestirilmemis"; exit 1; }
          grep -q "com.apple.security.application-groups" ios/.targets/BesWidget/generated.entitlements \
            || { echo "::error::widget App Group yetkisi eksik"; exit 1; }
          grep -q "com.apple.security.application-groups" "ios/$AD/$AD.entitlements" \
            || { echo "::error::uygulama App Group yetkisi eksik"; exit 1; }
          grep -q "BesWidget.appex in Embed Foundation Extensions" ios/*.xcodeproj/project.pbxproj \
            || { echo "::error::widget uygulamaya gomulmemis (Embed Foundation Extensions)"; exit 1; }
          echo "widget yapilandirmasi dogrulandi"

      - name: Derle (simulator, imzasiz)
        working-directory: bes/ios
        # pipefail olmadan "xcodebuild | tail" derleme coktugunde bile YESIL
        # doner (cikis kodu tail'e aittir). Sessiz yesil, kirmizidan kotudur.
        run: |
          set -o pipefail
          xcodebuild -workspace "$(basename "$WORKSPACE")" -scheme "$SEMA" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tail -40
