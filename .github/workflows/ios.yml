name: iOS build

# Her push'ta: simulator icin IMZASIZ derleme. Tek isi "uygulama iOS'ta hala
# derleniyor mu" sorusunu kapatmak; Apple hesabi gerektirmez.
#
# GERCEK YAYIN BU DOSYADA DEGIL: imzalama, IPA ve App Store Connect yuklemesi
# elle calistirilan .github/workflows/ios-release.yml icindedir. Ikisi bilerek
# ayri: her commit'te TestFlight'a build gondermek hem yavas olurdu hem de
# yayin kararini kazayla vermek demekti.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/ios.yml'
      - 'slot/**'
      - 'latch/**'
      - 'orbita/**'
      - 'lull/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: slot
            dir: slot
          - app: latch
            dir: latch
          - app: orbita
            dir: orbita
          - app: lull
            dir: lull
    name: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklar
        working-directory: ${{ matrix.dir }}
        run: npm install --no-audit --no-fund

      - name: iOS projesini olustur
        working-directory: ${{ matrix.dir }}
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Native ayarlari uygula
        working-directory: ${{ matrix.dir }}
        run: bash tools/ios-prepare.sh

      # Reklamli urunlerde AdMob anahtari BULUNMALI; reklamsiz olanlarda (lull)
      # BULUNMAMALI. Ikincisi daha onemli: ATT istemi cikaran bir uygulamanin
      # App Privacy formunda "veri toplanmiyor" demesi celiskidir.
      - name: Info.plist dogrula
        working-directory: ${{ matrix.dir }}
        run: |
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" ios/App/App/Info.plist
          # Ikon bir kez EKSIK gitti: ios-prepare.sh onu hic yerlestirmiyordu ve
          # TestFlight'a Capacitor'in bos yer tutucu ikonuyla bir yapi cikti.
          # Ikon magazada urunun yuzu; bir daha sessizce gecmesin.
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            || { echo "::error::uygulama ikonu yerlestirilmemis"; exit 1; }
          echo "uygulama ikonu yerinde"
          ADS_ON=$(node -p "String(require('./app.config.json').admob.enabled !== false ? 1 : 0)")
          if [ "$ADS_ON" = "1" ]; then
            /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" ios/App/App/Info.plist
          else
            for K in GADApplicationIdentifier NSUserTrackingUsageDescription SKAdNetworkItems; do
              if /usr/libexec/PlistBuddy -c "Print :$K" ios/App/App/Info.plist >/dev/null 2>&1; then
                echo "::error::reklamsiz urun ama Info.plist icinde $K var"; exit 1
              fi
            done
            echo "reklamsiz: GADApplicationIdentifier, ATT istemi ve SKAdNetwork yok (dogrulandi)"
          fi

      - name: Derle (simulator, imzasiz)
        working-directory: ${{ matrix.dir }}/ios/App
        # pipefail olmadan "xcodebuild | tail" derleme coktugunde bile YESIL
        # doner (cikis kodu tail'e aittir). Sessiz yesil, kirmizidan kotudur.
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tail -40
