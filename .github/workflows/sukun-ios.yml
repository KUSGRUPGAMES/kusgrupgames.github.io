name: Sukun iOS derleme

# Her push'ta: kalite kapisi (Linux) + simulator icin IMZASIZ derleme (macOS).
# Tek isi "Sukun iOS'ta hala derleniyor mu" sorusunu kapatmak; Apple hesabi
# gerektirmez.
#
# GERCEK YAYIN BU DOSYADA DEGIL: imzalama, IPA ve TestFlight yuklemesi elle
# calistirilan sukun-release-ios.yml icindedir. Ikisi bilerek ayri: her
# commit'te TestFlight'a build gondermek hem yavas olurdu hem de yayin
# kararini kazayla vermek demekti.
#
# Diger urunler Capacitor, Sukun Expo. Ayni matrise sokmak neredeyse her adima
# bir `if` eklemek demekti; bu yuzden Sukun'un kendi dosyasi var.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/sukun-ios.yml'
      - 'sukun/**'
  workflow_dispatch:

jobs:
  kapi:
    name: Kalite kapisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sukun/package-lock.json

      - name: Bagimliliklar
        working-directory: sukun
        run: npm ci --no-audit --no-fund

      # macOS dakikasi pahali; kirik kodu oraya hic gondermiyoruz.
      - name: tsc + eslint + test
        working-directory: sukun
        run: npm run gate

      # Metro, tsc ve jest'in kabul ettigi bazi kaliplari reddeder (sablon
      # degiskenli `require` boyleydi). Paketlemeyi ayri bir kapi sayiyoruz.
      - name: Metro paketi
        working-directory: sukun
        run: npm run bundle

  ios:
    name: iOS (imzasiz)
    needs: kapi
    runs-on: macos-latest
    env:
      APP_VARIANT: production
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sukun/package-lock.json

      - name: Bagimliliklar
        working-directory: sukun
        run: npm ci --no-audit --no-fund

      - name: Native projeyi uret
        working-directory: sukun
        run: npx expo prebuild --platform ios --clean

      # Ikon bir kez EKSIK gitti (Capacitor tarafinda) ve TestFlight'a bos yer
      # tutucu ikonuyla bir yapi cikti. Ikon magazada urunun yuzu.
      - name: Uretilen projeyi dogrula
        working-directory: sukun
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          AD=$(basename "$WS" .xcworkspace)
          echo "SEMA=$AD" >> "$GITHUB_ENV"
          echo "WORKSPACE=$WS" >> "$GITHUB_ENV"
          echo "sema: $AD"

          PLIST="ios/$AD/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"

          IKON=$(ls ios/$AD/Images.xcassets/AppIcon.appiconset/*.png 2>/dev/null | head -1)
          test -n "$IKON" || { echo "::error::uygulama ikonu yerlestirilmemis"; exit 1; }
          echo "ikon yerinde: $IKON"

          # Kullanilmayan arka plan konum izni App Review'da sorulur ve
          # reddedilir. expo-location eklentisi bunu varsayilan olarak yaziyordu.
          for K in NSLocationAlwaysUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$K" "$PLIST" >/dev/null 2>&1; then
              echo "::error::kullanilmayan arka plan konum izni: $K"; exit 1
            fi
          done
          echo "arka plan konum izni yok (dogrulandi)"

      - name: Derle (simulator, imzasiz)
        working-directory: sukun/ios
        # pipefail olmadan "xcodebuild | tail" derleme coktugunde bile YESIL
        # doner (cikis kodu tail'e aittir). Sessiz yesil, kirmizidan kotudur.
        run: |
          set -o pipefail
          xcodebuild -workspace "$(basename "$WORKSPACE")" -scheme "$SEMA" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tail -40
